services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: eventticketing-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eventticketing-backend

    # Chạy migration trước khi mở server để DB luôn đủ bảng
    command: ["sh", "-c", "npm run migrate && npm start"]

    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DEPLOY_ENV: ${DEPLOY_ENV:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thieu JWT_SECRET trong file .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SEAT_HOLD_TTL_SECONDS: ${SEAT_HOLD_TTL_SECONDS:-600}
      SEAT_HOLD_CLEANUP_INTERVAL_MS: ${SEAT_HOLD_CLEANUP_INTERVAL_MS:-30000}
      # S-21 / T-49: backend chỉ nhận request qua Nginx, tin đúng 1 lớp proxy để lấy IP nguồn
      TRUST_PROXY: '1'
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-}
      MOCK_PAYMENT_PUBLIC_ORIGIN: ${MOCK_PAYMENT_PUBLIC_ORIGIN:-http://localhost:3000}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_API_BASE_URL: ${MOMO_API_BASE_URL:-https://test-payment.momo.vn}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:8080/payment/return}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-}
      # S-26: khoá ký QR trên vé (>= 32 ký tự). Để trống thì dẫn xuất từ JWT_SECRET.
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:-}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        # Gọi API cùng địa chỉ với web, Nginx chuyển /api/ sang backend
        VITE_API_URL: /api

    container_name: eventticketing-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data:
