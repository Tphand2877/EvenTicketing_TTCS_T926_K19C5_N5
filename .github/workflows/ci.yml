  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    needs:
      - backend-build
      - backend-lint
      - backend-test
      - frontend-build
      - frontend-lint

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: docker info

      - name: Create staging environment
        shell: powershell
        env:
          POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
        run: |
          "POSTGRES_DB=$env:POSTGRES_DB" | Out-File .env -Encoding utf8
          "POSTGRES_USER=$env:POSTGRES_USER" | Out-File .env -Encoding utf8 -Append
          "POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD" | Out-File .env -Encoding utf8 -Append

      - name: Build backend staging image
        shell: powershell
        run: docker build -t eventticketing-backend:staging ./backend

      - name: Build frontend staging image
        shell: powershell
        run: |
          docker build `
            --build-arg VITE_API_URL=http://localhost:3000 `
            -t eventticketing-frontend:staging `
            ./frontend

      - name: Deploy local staging
        shell: powershell
        run: |
          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\scripts\deploy-staging.ps1

      - name: Verify staging
        shell: powershell
        run: |
          docker compose `
            -p eventticketing-staging `
            -f docker-compose.staging.yml `
            ps