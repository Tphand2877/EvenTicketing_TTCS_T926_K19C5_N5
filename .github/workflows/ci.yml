name: CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

jobs:

  # =========================
  # BACKEND BUILD
  # =========================
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build


  # =========================
  # BACKEND LINT
  # =========================
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint


  # =========================
  # BACKEND TEST
  # =========================
  backend-test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: eventticketing
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      RUN_PUBLIC_QUERY_DB_TESTS: '1'
      RUN_PUBLIC_QUERY_REDIS_TESTS: '1'
      RUN_SEAT_HOLD_DB_TESTS: '1'
      RUN_SEAT_MAP_DB_TESTS: '1'
      RUN_SHOWTIME_SALE_DB_TESTS: '1'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: eventticketing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d eventticketing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test


  # =========================
  # FRONTEND BUILD
  # =========================
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # =========================
  # FRONTEND LINT
  # =========================
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint


  # =========================
  # DEPLOY STAGING
  # =========================
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    needs:
      - backend-build
      - backend-lint
      - backend-test
      - frontend-build
      - frontend-lint

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: docker info

      - name: Create staging environment
        shell: powershell
        env:
          POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
        run: |
          "POSTGRES_DB=$env:POSTGRES_DB" | Out-File -FilePath .env -Encoding utf8
          "POSTGRES_USER=$env:POSTGRES_USER" | Out-File -FilePath .env -Encoding utf8 -Append
          "POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD" | Out-File -FilePath .env -Encoding utf8 -Append

      - name: Build backend staging image
        shell: powershell
        run: |
          docker build `
            -t eventticketing-backend:staging `
            ./backend

      - name: Build frontend staging image
        shell: powershell
        run: |
          docker build `
            --build-arg VITE_API_URL=http://localhost:3000 `
            -t eventticketing-frontend:staging `
            ./frontend

      - name: Deploy local staging
        shell: powershell
        run: |
          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\scripts\deploy-staging.ps1

      - name: Verify staging containers
        shell: powershell
        run: |
          docker compose `
            -p eventticketing-staging `
            -f docker-compose.staging.yml `
            ps
