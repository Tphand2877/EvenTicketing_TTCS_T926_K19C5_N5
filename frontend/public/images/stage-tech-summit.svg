<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="keynoteStage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="vipGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="techStd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" rx="20" fill="url(#techBg)"/>
  <rect x="20" y="20" width="960" height="760" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="65" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold" letter-spacing="4" font-family="system-ui, sans-serif">
    VIETNAM TECH SUMMIT 2026 &#8226; GEM CENTER TP.HCM
  </text>
  <text x="500" y="98" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="900" letter-spacing="2" font-family="system-ui, sans-serif">
    SƠ ĐỒ HỘI TRƯỜNG &amp; SÂN KHẤU KEYNOTE
  </text>

  <!-- MÀN HÌNH LED PANORAMA & SÂN KHẤU -->
  <rect x="180" y="130" width="640" height="40" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
    MÀN HÌNH LED CONG PANORAMA 8K TRUNG TÂM
  </text>

  <rect x="220" y="175" width="560" height="80" rx="12" fill="url(#keynoteStage)" opacity="0.95"/>
  <text x="500" y="222" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="3" font-family="system-ui, sans-serif">
    SÂN KHẤU KEYNOTE &amp; DIỄN GIẢ (SPEAKER STAGE)
  </text>

  <!-- CỔNG VÀO CHECKIN -->
  <g transform="translate(40, 270)">
    <rect width="130" height="110" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">CỔNG VÀO A</text>
    <text x="65" y="60" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">KHÁCH VIP &amp; DIỄN GIẢ</text>
    <text x="65" y="85" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">CHECK-IN ƯU TIÊN</text>
  </g>

  <g transform="translate(830, 270)">
    <rect width="130" height="110" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">CỔNG VÀO B</text>
    <text x="65" y="60" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">ĐẠI BIỂU TIÊU CHUẨN</text>
    <text x="65" y="85" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">CHECK-IN TỰ ĐỘNG</text>
  </g>

  <!-- KHU VIP DIỄN GIẢ & DOANH NGHIỆP (HÀNG A - B) -->
  <g transform="translate(200, 280)">
    <rect width="600" height="110" rx="14" fill="url(#vipGold)" opacity="0.95"/>
    <text x="300" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">
      KHU VỰC VIP DELEGATES (HÀNG A &amp; HÀNG B)
    </text>
    <text x="300" y="72" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      DÀNH CHO LÃNH ĐẠO DOANH NGHIỆP, DIỄN GIẢ &amp; KHÁCH MỜI ĐẶC BIỆT
    </text>
    <text x="300" y="94" text-anchor="middle" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif">
      (Ghế tương ứng trên sơ đồ: Hàng A: A1 - A20, Hàng B: B1 - B20)
    </text>
  </g>

  <!-- KHU VỰC ĐẠI BIỂU TIÊU CHUẨN (HÀNG C - O) -->
  <g transform="translate(180, 420)">
    <rect width="640" height="210" rx="14" fill="url(#techStd)" opacity="0.9"/>
    <text x="320" y="55" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900" font-family="system-ui, sans-serif">
      KHU VỰC THAM DỰ TIÊU CHUẨN (HÀNG C ĐẾN HÀNG O)
    </text>
    <text x="320" y="90" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      KHÔNG GIAN HỘI TRƯỜNG DỐC BẬC THANG &#8226; TẦM NHÌN TRỰC DIỆN MÀN HÌNH CHÍNH
    </text>
    <text x="320" y="125" text-anchor="middle" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif">
      (Ghế tương ứng trên sơ đồ: Hàng C, D, E, F, G, H, I, J, K, L, M, N, O)
    </text>
    <text x="320" y="160" text-anchor="middle" fill="#e0f2fe" font-size="11" font-family="system-ui, sans-serif">
      Trang bị bàn gập, cổng sạc thiết bị di động &#8226; Lối đi thông thoáng hai bên
    </text>
  </g>

  <!-- BẢNG CHÚ GIẢI -->
  <g transform="translate(180, 660)">
    <rect width="640" height="85" rx="14" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="22" width="22" height="22" rx="6" fill="#f59e0b"/>
    <text x="58" y="38" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Hạng VIP (Hàng A - B)</text>
    <text x="58" y="58" fill="#fde68a" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">500.000đ / vé &#8226; Đặt ghế phía dưới</text>

    <rect x="340" y="22" width="22" height="22" rx="6" fill="#0284c7"/>
    <text x="375" y="38" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Hạng Tiêu Chuẩn (Hàng C - O)</text>
    <text x="375" y="58" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">300.000đ / vé &#8226; Đặt ghế phía dưới</text>
  </g>
</svg>
