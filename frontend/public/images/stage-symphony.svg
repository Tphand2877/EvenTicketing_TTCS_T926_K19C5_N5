<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e102d"/>
      <stop offset="100%" stop-color="#0b0614"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="vipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="stdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" rx="20" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="760" rx="16" fill="none" stroke="#4c1d95" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Title -->
  <text x="500" y="65" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="900" letter-spacing="3" font-family="system-ui, sans-serif">
    SƠ ĐỒ KHÁN PHÒNG NHÀ HÁT LỚN
  </text>
  <text x="500" y="95" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">
    HÒA NHẠC GIAO HƯỞNG &amp; NGHỆ THUẬT CỔ ĐIỂN
  </text>

  <!-- SÂN KHẤU CHÍNH (STAGE) -->
  <path d="M 250 150 Q 500 120 750 150 L 780 230 Q 500 260 220 230 Z" fill="url(#stageGrad)" opacity="0.95"/>
  <text x="500" y="195" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif">
    SÂN KHẤU GIAO HƯỞNG (ORCHESTRA STAGE)
  </text>

  <!-- DÀN NHẠC GIAO HƯỞNG & BỤC CHỈ HUY -->
  <path d="M 360 235 Q 500 250 640 235 L 610 265 Q 500 280 390 265 Z" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="500" y="258" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="700" font-family="system-ui, sans-serif">
    DÀN NHẠC &amp; BỤC NHẠC TRƯỞNG
  </text>

  <!-- CỔNG VÀO TẢ / HỮU -->
  <g transform="translate(40, 280)">
    <rect width="120" height="90" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="60" y="32" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">CỔNG VÀO 1</text>
    <text x="60" y="55" text-anchor="middle" fill="#a5b4fc" font-size="11" font-family="system-ui, sans-serif">CỬA TẢ KHÁN PHÒNG</text>
    <text x="60" y="75" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">VIP &amp; TIÊU CHUẨN</text>
    <path d="M 130 45 L 160 45" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(840, 280)">
    <rect width="120" height="90" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="60" y="32" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">CỔNG VÀO 2</text>
    <text x="60" y="55" text-anchor="middle" fill="#a5b4fc" font-size="11" font-family="system-ui, sans-serif">CỬA HỮU KHÁN PHÒNG</text>
    <text x="60" y="75" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">VIP &amp; TIÊU CHUẨN</text>
  </g>

  <!-- KHU VỰC GHẾ VIP (HÀNG A - B) -->
  <g transform="translate(200, 310)">
    <path d="M 40 0 Q 300 25 560 0 L 590 90 Q 300 120 10 90 Z" fill="url(#vipGrad)" opacity="0.95"/>
    <text x="300" y="42" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui, sans-serif">
      KHU VỰC VIP PARTERRE (HÀNG A &amp; HÀNG B)
    </text>
    <text x="300" y="68" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      VỊ TRÍ CHÍNH DIỆN SÂN KHẤU - ÂM THANH TRỰC TIẾP TỐT NHẤT
    </text>
    <text x="300" y="88" text-anchor="middle" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif">
      (Ghế tương ứng trên sơ đồ: Hàng A: A1 - A20, Hàng B: B1 - B20)
    </text>
  </g>

  <!-- KHU VỰC GHẾ TIÊU CHUẨN (HÀNG C - O) -->
  <g transform="translate(160, 440)">
    <path d="M 30 0 Q 340 30 650 0 L 670 170 Q 340 210 10 170 Z" fill="url(#stdGrad)" opacity="0.9"/>
    <text x="340" y="55" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="900" font-family="system-ui, sans-serif">
      KHU VỰC KHÁN PHÒNG TIÊU CHUẨN (HÀNG C ĐẾN HÀNG O)
    </text>
    <text x="340" y="85" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      TẦM NHÌN TOÀN CẢNH KHÁN PHÒNG &amp; HỆ THỐNG ÂM HƯỞNG VÒM
    </text>
    <text x="340" y="112" text-anchor="middle" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif">
      (Ghế tương ứng trên sơ đồ: Hàng C, D, E, F, G, H, I, J, K, L, M, N, O)
    </text>
    <text x="340" y="140" text-anchor="middle" fill="#bae6fd" font-size="11" font-family="system-ui, sans-serif">
      Lối đi chính giữa tách 2 cánh khán phòng &#8226; Cửa thoát hiểm hai bên
    </text>
  </g>

  <!-- BẢNG CHÚ GIẢI PHÂN KHU (LEGEND BOTTOM) -->
  <g transform="translate(180, 670)">
    <rect width="640" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- VIP Item -->
    <rect x="25" y="22" width="22" height="22" rx="6" fill="#ec4899"/>
    <text x="58" y="38" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Khu VIP (Hàng A &amp; B)</text>
    <text x="58" y="58" fill="#fda4af" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">500.000đ / vé &#8226; Đặt trực tiếp bên dưới</text>

    <!-- Standard Item -->
    <rect x="340" y="22" width="22" height="22" rx="6" fill="#06b6d4"/>
    <text x="375" y="38" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Khu Tiêu Chuẩn (Hàng C - O)</text>
    <text x="375" y="58" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">300.000đ / vé &#8226; Đặt trực tiếp bên dưới</text>
  </g>
</svg>
